<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt Architect — Tests</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background: #0b0b0f; color: #e5e5ea; margin: 0; padding: 28px; }
  h1 { font-size: 20px; font-weight: 700; }
  .sub { color: #8a8a99; font-size: 13px; margin-bottom: 18px; }
  #summary { font-size: 17px; font-weight: 700; padding: 14px 18px; border-radius: 10px; margin-bottom: 16px; }
  .pass { background: #0f2e1f; color: #9fd77a; border: 1px solid #1f6e4e; }
  .fail { background: #3a1414; color: #f87171; border: 1px solid #7a2a2a; }
  .row { padding: 7px 12px; border-bottom: 1px solid #1e1e28; font-size: 14px; }
  .ok { color: #9fd77a; margin-right: 9px; }
  .no { color: #f87171; margin-right: 9px; }
  .err { color: #fbbf24; font-size: 12.5px; margin: 2px 0 8px 26px; }
</style>
</head>
<body>
<h1>Prompt Architect — automated tests</h1>
<div class="sub">Open this page at <code>http://localhost:3737/tests.html</code> any time to re-check the engine after changes.</div>
<div id="summary">Running…</div>
<div id="list"></div>

<!-- Scripts are deliberately unversioned here: this harness runs only on the local
     server.py, which sends Cache-Control: no-cache — so ?v= busting is unnecessary. -->
<script src="config.js"></script>
<script src="data.js"></script>
<script src="style-library.js"></script>

</body>
</html>
